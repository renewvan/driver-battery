[project]
name = "driver-battery"
version = "0.1.0"
description = "Victron Venus OS MQTT -> van-bus battery remap driver"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_battery*"]
